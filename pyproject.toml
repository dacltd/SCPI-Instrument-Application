[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scpi-lab-instrument-app"
version = "0.1.0"
description = "Desktop application for monitoring and logging SCPI lab instruments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.6",
  "PyVISA>=1.14",
  "PyVISA-py[hislip-discovery,psutil,serial,usb-full]>=0.7",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pyinstaller",
  "pytest",
  "ruff",
]

[project.scripts]
scpi-lab-instrument-app = "dmm_app.main:main"

[tool.setuptools.packages.find]
include = ["dmm_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'win32'",
]
